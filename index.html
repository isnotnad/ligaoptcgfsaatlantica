<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ranking da Liga</title><link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#f0e1bd;--card:#fbf4e0;--tx:#2b1d10;--mu:#715c42;--bd:#c8a96f;--ac:#b3261e;--ac2:#f9e2a0;--onac:#fff;--g:#d4a017;--s:#9aa0a6;--b:#b0703c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a2b;--card:#15273f;--tx:#f5ebd3;--mu:#9db0c6;--bd:#2d4868;--ac:#f2b632;--ac2:#2a2410;--onac:#1b1205;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a2b;--card:#15273f;--tx:#f5ebd3;--mu:#9db0c6;--bd:#2d4868;--ac:#f2b632;--ac2:#2a2410;--onac:#1b1205;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font:400 2.4rem/1.1 "Pirata One","Palatino Linotype",Georgia,serif;letter-spacing:.02em;color:var(--ac);margin:.2em 0 .1em}h2{font:400 1.5rem/1.2 "Pirata One","Palatino Linotype",Georgia,serif;letter-spacing:.02em;margin:0 0 12px}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);background:color-mix(in srgb,var(--card) 66%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15);border:2px solid var(--bd);border-radius:10px;box-shadow:0 3px 0 var(--bd);padding:16px;margin-bottom:18px}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(#5f93c8 0,#c9dbe8 42%,#1d5a7c 43%,#072c48 100%)}
body::after{display:none}
@keyframes mv{to{background-position-x:-800px}}
@media (prefers-reduced-motion:reduce){body::after{animation:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before,:root:not([data-theme="light"]) body::after{filter:brightness(.42) saturate(.9)}}
:root[data-theme="dark"] body::before,:root[data-theme="dark"] body::after{filter:brightness(.42) saturate(.9)}
h1{text-shadow:0 2px 8px rgba(0,0,0,.3)}
.w>.sub{display:inline-block;padding:6px 12px;border-radius:8px;color:var(--tx);background:var(--card);background:color-mix(in srgb,var(--card) 74%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cr{display:block;margin:0 auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #sea{filter:brightness(.42) saturate(.9)}}
:root[data-theme="dark"] #sea{filter:brightness(.42) saturate(.9)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--bd)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
td.n,th.n{text-align:left}td.n{font-weight:600}
td.pt{font-weight:700;color:var(--ac)}
.pos{display:inline-block;min-width:28px;height:28px;line-height:28px;border-radius:50%;font-weight:700;font-size:.85rem}
.p1{background:var(--g);color:#fff}.p2{background:var(--s);color:#fff}.p3{background:var(--b);color:#fff}
input,button{font:inherit;color:var(--tx)}
input{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
table input{padding:6px 8px;text-align:center}table input.nm{text-align:left}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:9px}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:600}
button.sm{padding:4px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.ev{border-top:1px solid var(--bd);padding:12px 0}.ev:first-of-type{border-top:0}
.ev small{color:var(--mu)}.ev table{margin-top:8px;min-width:300px}.ev th,.ev td{padding:5px 8px;border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1;padding:10px;font:400 1.2rem "Pirata One","Palatino Linotype",Georgia,serif;letter-spacing:.03em}.tabs button.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}.decks figure{margin:0;border:1px solid var(--bd);border-radius:10px;padding:8px}.decks figcaption{font-weight:600;margin-bottom:6px}.decks img{width:100%;display:block;border-radius:6px;cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;cursor:zoom-out}.lb img{max-width:100%;max-height:100%;object-fit:contain}
.fl{cursor:pointer;font-size:.8rem;border:1px solid var(--bd);border-radius:8px;padding:3px 8px;background:var(--card);display:inline-block;white-space:nowrap}
.ev>img{display:block;max-width:100%;max-height:420px;border-radius:10px;margin-top:10px}
.adm{border-color:var(--ac);background:var(--ac2)}.adm table{min-width:380px}
.empty{color:var(--mu);text-align:center;padding:24px 0}
.tag{font-size:.75rem;background:var(--card);color:var(--ac);padding:2px 8px;border-radius:99px;margin-left:8px}
</style></head><body><div id="root"></div>

<script id="app">
const S=JSON.parse(document.getElementById('data').textContent);
S.win=S.win??3;S.loss=S.loss??0;

function drawSea(){
  const W=640,H=360,Y0=Math.floor(H*.42),c=document.createElement('canvas');
  c.id='sea';c.width=W;c.height=H;
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;pointer-events:none';
  document.body.prepend(c);
  const g=c.getContext('2d'),im=g.createImageData(W,H),D=im.data;
  const hs=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return hs(xi,yi)*(1-u)*(1-v)+hs(xi+1,yi)*u*(1-v)+hs(xi,yi+1)*(1-u)*v+hs(xi+1,yi+1)*u*v};
  const fbm=(x,y,o)=>{let a=.5,s=0;for(let i=0;i<o;i++){s+=a*vn(x,y);x=x*2.03+17.1;y=y*2.03+5.3;a*=.5}return s};
  const cl=(v,a,b)=>v<a?a:v>b?b:v,mx=(a,b,t)=>a+(b-a)*t;
  const T=[46,98,166],M=[120,167,208],HR=[226,224,214],C=[0,0,0];
  const sky=el=>{el=cl(el,0,1);const t=Math.sqrt(el),a=t<.5?HR:M,b=t<.5?M:T,k=t<.5?t/.5:(t-.5)/.5;C[0]=mx(a[0],b[0],k);C[1]=mx(a[1],b[1],k);C[2]=mx(a[2],b[2],k)};
  const hgt=(px,z)=>.55*fbm(px*.30+1.7,z*.22,3)+.30*fbm(px*.9+9,z*.55,4)+.10*fbm(px*2.6,z*1.5,3);
  const ll=Math.hypot(.3,.2,1),Lx=.3/ll,Ly=.2/ll,Lz=1/ll;
  const sx=Math.floor(W*.5+Lx/Lz*W*.6),sy=Math.floor(Y0-Ly/Lz*H*1.2);
  const camH=1.6,e=.04;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let r,gg,b;
    if(y<Y0){
      const el=(Y0-y)/Y0;sky(el);
      const cm=cl((fbm(x*.010+3,((Y0-y)*.045+.5/(el+.15)*.02)*3.2,5)-.46)*3.2,0,1)*cl(1-el*.55,0,1),k=(.8+.2*cl(el,0,1)),w=cm*.85;
      const dd=Math.hypot(x-sx,y-sy),sun=Math.exp(-dd/90)*.35+Math.exp(-dd/14)*.5;
      r=mx(C[0],248*k,w)+255*sun;gg=mx(C[1],244*k,w)+205*sun;b=mx(C[2],236*k,w)+140*sun;
    }else{
      const d=cl((y-Y0)/(H-Y0),0,1),z=2.2/(d+.012),px=(x-W/2)/(W/2)*z*.95;
      const hx=(hgt(px+e,z)-hgt(px-e,z))/(2*e),hz=(hgt(px,z+e)-hgt(px,z-e))/(2*e),amp=1.1/(1+z*.035);
      let nx=-hx*amp,ny=1,nz=-hz*amp;const nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl;
      let vx=px,vy=-camH,vz=z;const vl=Math.hypot(vx,vy,vz);vx/=vl;vy/=vl;vz/=vl;
      const vdn=vx*nx+vy*ny+vz*nz,Rx=vx-2*vdn*nx,Ry=vy-2*vdn*ny,Rz=vz-2*vdn*nz;
      const F=.02+.98*Math.pow(1-cl(-vdn,0,1),5);
      sky(cl(Ry,0,1));
      const ry=Math.max(Ry,.04),rc=fbm(Rx/ry*.25+3,1/ry*.05,4),ck=cl((rc-.47)*3,0,1)*cl(1-Ry*2,0,1)*.6;
      const sr=mx(C[0],240,ck),sg=mx(C[1],238,ck),sb=mx(C[2],232,ck);
      const t=cl((hgt(px,z)-.45)*1.6+.25,0,1),sh=.55+.45*cl(ny*.9,0,1);
      const br=mx(6,22,t)*sh,bg=mx(42,96,t)*sh,bb=mx(66,112,t)*sh;
      const rd=cl(Rx*Lx+Ry*Ly+Rz*Lz,0,1),sp=Math.pow(rd,900)*2.6+Math.pow(rd,120)*.45+Math.pow(rd,18)*.12;
      r=br*(1-F)+sr*F+255*sp;gg=bg*(1-F)+sg*F+225*sp;b=bb*(1-F)+sb*F+170*sp;
      const hz2=Math.exp(-d*14)*.55;r=mx(r,205,hz2);gg=mx(gg,215,hz2);b=mx(b,222,hz2);
    }
    const dx=(x-W/2)/(W/2),dy=(y-H/2)/(H/2),vg=1-.25*(dx*dx+dy*dy)*.5,i=(y*W+x)*4;
    D[i]=cl(r*vg,0,255);D[i+1]=cl(gg*vg,0,255);D[i+2]=cl(b*vg,0,255);D[i+3]=255;
  }
  g.putImageData(im,0,0);
}
const CR={1:['#f7cf2e','#a67c00'],2:['#e3e7ec','#7d858e'],3:['#d98a45','#7a4a1c']};
const crown=n=>`<svg class="cr" viewBox="0 0 40 34" width="38" height="32" role="img" aria-label="${n}º lugar"><path d="M4 29L2 8l10 9L20 3l8 14 10-9-2 21z" fill="${CR[n][0]}" stroke="${CR[n][1]}" stroke-width="2" stroke-linejoin="round"/><rect x="4" y="26" width="32" height="5" rx="1.5" fill="${CR[n][1]}"/><circle cx="2" cy="8" r="2.4" fill="${CR[n][0]}" stroke="${CR[n][1]}" stroke-width="1.5"/><circle cx="20" cy="3" r="2.4" fill="${CR[n][0]}" stroke="${CR[n][1]}" stroke-width="1.5"/><circle cx="38" cy="8" r="2.4" fill="${CR[n][0]}" stroke="${CR[n][1]}" stroke-width="1.5"/><text x="20" y="22" text-anchor="middle" font-size="13" font-weight="700" font-family="system-ui,sans-serif" fill="#2b1d10">${n}</text></svg>`;
function rank(){
  const m=new Map();
  for(const e of S.events)for(const x of e.players||[]){
    const k=x.name.toLowerCase();let p=m.get(k);
    if(!p){p={name:x.name,w:0,d:0,ev:0};m.set(k,p)}
    p.w+=x.w;p.d+=x.d;p.ev++;
  }
  return [...m.values()].map(p=>({...p,pts:pts(p.w,p.d)})).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.d-b.d||a.name.localeCompare(b.name));
}

function render(){
  const R=rank(),f=R.map((p,i)=>({...p,pos:i+1})).filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
  const evs=[...S.events].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let h=`<div class="w"><h1>🏴‍☠️ ${esc(S.title)}</h1><p class="sub">${S.events.length} evento(s) · ${R.length} jogador(es) · vitória = ${S.win} pts · derrota = ${S.loss} pts</p>`;

  if(canEdit)h+=admin();
  if(tab=='ranking'){h+=`<div class="card"><h2>Ranking geral</h2><input id="q" placeholder="Buscar jogador…" value="${esc(q)}" style="margin-bottom:10px">`;
  h+=f.length?`<div class="sc"><table><tr><th>#</th><th class="n">Jogador</th><th>Pontos</th><th>Vitórias</th><th>Derrotas</th><th>Eventos</th></tr>${f.map(p=>`<tr><td>${p.pos<4?crown(p.pos):`<span class="pos">${p.pos}</span>`}</td><td class="n">${esc(p.name)}</td><td class="pt">${p.pts}</td><td>${p.w}</td><td>${p.d}</td><td>${p.ev}</td></tr>`).join('')}</table></div>`:`<div class="empty">${R.length?'Nenhum jogador encontrado.':'Ainda não há eventos cadastrados.'}</div>`;
  h+='</div>';}
  if(tab=='eventos'){h+=`<div class="card"><h2>Eventos</h2>`;
  h+=evs.length?evs.map(e=>`<div class="ev"><b>${esc(e.name)}</b> <small>${fmt(e.date)}</small>${canEdit?` <button class="sm" data-ed="${e.id}">Editar</button> <button class="sm" data-del="${e.id}">Excluir</button>`:''}${e.img?`<img src="${e.img}" alt="Imagem do evento">`:''}<div class="sc"><table><tr><th class="n">Jogador</th><th>V</th><th>D</th><th>Pontos</th></tr>${[...e.players].sort((a,b)=>pts(b.w,b.d)-pts(a.w,a.d)||b.w-a.w).map(x=>`<tr><td class="n">${esc(x.name)}</td><td>${x.w}</td><td>${x.d}</td><td class="pt">${pts(x.w,x.d)}</td></tr>`).join('')}</table></div>${e.players.some(x=>x.deck)?`<p style="margin:10px 0 0"><button class="sm" data-info="${e.id}">${openEv[e.id]?'Ocultar informações':'Mais informações'}</button></p>`:''}${openEv[e.id]?`<div class="decks">${[...e.players].filter(x=>x.deck).sort((a,b)=>pts(b.w,b.d)-pts(a.w,a.d)||b.w-a.w).map(x=>`<figure><figcaption>${esc(x.name)} <small>· decklist</small></figcaption><img src="${x.deck}" alt="Decklist de ${esc(x.name)}"></figure>`).join('')}</div>`:''}</div>`).join(''):'<div class="empty">Nenhum evento ainda.</div>';
  h+='</div>';}
  h+='</div>';
  $('root').innerHTML=h;
  document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{const y=window.scrollY;openEv[b.dataset.info]=!openEv[b.dataset.info];render();window.scrollTo(0,y)});

  const qi=$('q');if(qi)qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const e=S.events.find(x=>x.id==b.dataset.ed);editId=e.id;dm={name:e.name,date:e.date,img:e.img||''};draft=e.players.map(x=>({...x}));render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const e=S.events.find(x=>x.id==b.dataset.del);if(confirm('Excluir o evento “'+e.name+'”?')){S.events=S.events.filter(x=>x!=e);save()}});
  if(canEdit)bindAdmin();
}

function admin(){
  return `<div class="card adm"><h2>Modo organizador <span class="tag">só você vê</span></h2>
  ${local?`<p class="sub" style="margin:0 0 10px">Modo local: as alterações ficam só neste navegador até você baixar o arquivo atualizado. ${dirty?'<b>Há alterações não baixadas.</b> ':''}<button class="pri sm" id="dl">⬇ Baixar site atualizado</button></p>`:''}
  <label>${editId?'Editando evento':'Novo evento'}</label>
  <div class="row"><input id="en" placeholder="Nome do evento" value="${esc(dm.name)}"><input id="ed" type="date" value="${dm.date}"></div>
  <label>Imagem do evento (opcional)</label><input id="ei" type="file" accept="image/*">${dm.img?`<div style="margin-top:8px"><img src="${dm.img}" alt="" style="max-width:220px;border-radius:8px;display:block"><button class="sm" id="ri" style="margin-top:6px">Remover imagem</button></div>`:''}
  <div class="sc"><table style="margin-top:10px"><tr><th class="n">Jogador</th><th>Vitórias</th><th>Derrotas</th><th>Pontos</th><th>Decklist</th><th></th></tr>
  ${draft.map((x,i)=>`<tr><td><input class="nm" data-i="${i}" data-f="name" placeholder="Nome" value="${esc(x.name)}"></td><td><input type="number" min="0" data-i="${i}" data-f="w" value="${x.w}"></td><td><input type="number" min="0" data-i="${i}" data-f="d" value="${x.d}"></td><td class="pt" id="pt${i}">${pts(x.w,x.d)}</td><td><label class="fl">${x.deck?'✓ trocar':'+ imagem'}<input type="file" accept="image/*" data-dk="${i}" hidden></label>${x.deck?` <button class="sm" data-rd="${i}">remover</button>`:''}</td><td><button class="sm" data-rm="${i}">✕</button></td></tr>`).join('')}</table></div>
  <p style="margin:10px 0 0"><button id="ad">+ Jogador</button> <button class="pri" id="sv">${editId?'Salvar alterações':'Adicionar evento'}</button> ${editId?'<button id="cx">Cancelar</button>':''}</p>
  <hr style="border:0;border-top:1px solid var(--bd);margin:18px 0">
  <label>Nome da liga</label><input id="ct" value="${esc(S.title)}">
  <div class="row"><div><label>Pontos por vitória</label><input id="cw" type="number" value="${S.win}"></div><div><label>Pontos por derrota</label><input id="cl" type="number" value="${S.loss}"></div></div>
  <p style="margin:10px 0 0"><button id="cf">Salvar configurações</button></p>
  <p class="sub" style="margin:10px 0 0;font-size:.8rem">Tamanho da página: ${(build().length/1048576).toFixed(1)} MB de 16 MB (imagens ocupam espaço)</p></div>`;
}
function bindAdmin(){
  $('ei').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{dm.img=await shrink(f);render()}catch(x){alert('Não foi possível ler a imagem.')}};
  if($('ri'))$('ri').onclick=()=>{dm.img='';render()};
  $('en').oninput=e=>dm.name=e.target.value;$('ed').oninput=e=>dm.date=e.target.value;
  document.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=()=>{
    const i=+inp.dataset.i,f=inp.dataset.f;draft[i][f]=f=='name'?inp.value:Math.max(0,parseInt(inp.value)||0);
    $('pt'+i).textContent=pts(draft[i].w,draft[i].d);
  });
  document.querySelectorAll('[data-dk]').forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{draft[+inp.dataset.dk].deck=await shrink(f,1200,0.7);render()}catch(x){alert('Não foi possível ler a imagem.')}});
  document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{draft[+b.dataset.rd].deck='';render()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.rm,1);if(!draft.length)draft.push({name:'',w:0,d:0});render()});
  $('ad').onclick=()=>{draft.push({name:'',w:0,d:0});render();const n=document.querySelectorAll('.nm');n[n.length-1].focus()};
  if($('dl'))$('dl').onclick=download;
  $('sv').onclick=saveEvent;$('cf').onclick=saveCfg;
  if($('cx'))$('cx').onclick=()=>{resetDraft();render()};
}
function shrink(file,mx=1200,ql=0.8){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',ql))};im.src=r.result};r.readAsDataURL(file)})}
function resetDraft(){editId=null;dm={name:'',date:new Date().toISOString().slice(0,10)};draft=[{name:'',w:0,d:0}]}

function saveEvent(){
  const name=dm.name.trim();
  const known={};S.events.forEach(ev=>ev.players.forEach(x=>known[x.name.toLowerCase()]??=x.name));
  const players=draft.map(x=>({name:x.name.replace(/\s+/g,' ').trim(),w:x.w,d:x.d,deck:x.deck||''})).filter(x=>x.name).map(x=>({...x,name:known[x.name.toLowerCase()]||x.name}));
  if(!name||!players.length){alert('Informe o nome do evento e ao menos um jogador.');return}
  if(new Set(players.map(x=>x.name.toLowerCase())).size<players.length){alert('Há jogador repetido neste evento.');return}
  const ev={id:editId||String(Date.now()),name,date:dm.date,img:dm.img||'',players};
  if(editId)S.events=S.events.map(x=>x.id==editId?ev:x);else S.events.push(ev);
  resetDraft();save();
}
function saveCfg(){
  S.title=$('ct').value.trim()||'Ranking da Liga';
  S.win=parseInt($('cw').value)||0;S.loss=parseInt($('cl').value)||0;save();
}

function download(){const b=new Blob([build()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';document.body.appendChild(a);a.click();a.remove();dirty=false;render()}
window.addEventListener('beforeunload',e=>{if(local&&dirty){e.preventDefault();e.returnValue=''}});
function build(){
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(S.title)+'</title><link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet"><style id="css">'+CSS+'</style></head><body><div id="root"></div>\n<script type="application/json" id="data">'+json+'<\/script>\n<script id="app">'+APP+'<\/script></body></html>';
}
async function save(){
  if(!art){if(local){dirty=true;render();window.scrollTo(0,0);return}render();alert('Salvar só funciona na página publicada, aberta por você.');return}
  try{await art.publish(build())}catch(e){if(e&&e.code!=='conflict'){alert('Não foi possível salvar: '+(e.message||e.code));render()}}
}

window.addEventListener('hashchange',()=>{const t=location.hash=='#eventos'?'eventos':'ranking';if(t!=tab){tab=t;render()}});
render();
setTimeout(()=>{try{drawSea()}catch(e){}},60);
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const u=await claude.use('user');canEdit=!!(u&&u.canEdit());
  if(canEdit){art=await claude.use('artifact');render()}
}catch(e){}})();
</script></body></html>
